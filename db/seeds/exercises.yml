# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/303/side-plank/
- slug: side-plank
  name: Side plank
  category: activation
  areas: [core]
  pattern: anti_rotation
  unilateral: true
  default_seconds: 45
  cues:
    - Elbow under shoulder
    - Drive the elbow into the ground
    - Hips high, body in one line
  instructions:
    - Lie on your side with the legs straight and stacked, elbow under the shoulder.
    - Push the forearm into the floor and lift the hips until the body is one straight line.
    - Keep the head in line with the spine and the top hip stacked over the bottom one.
    - Hold and breathe; lower before the hips start to sag.
  animation:
    anchor: elbow_far
    accent: [torso, thigh_far, shin_far]
    highlight: [hip]
    props: [{ type: mat, x: 20, width: 170 }]
    still: 1
    keyframes:
      - pose: { torso: -154.4, neck: 0, upper_arm_far: 90, forearm_far: 180, thigh_far: 6.3, shin_far: 6.3, foot_far: 100, thigh_near: 6.3, shin_near: 6.3, foot_near: 100, upper_arm_near: 6, forearm_near: 6 }
        scale: { forearm_far: 0.5, foot_far: 0.4, foot_near: 0.4 }
        at: [47, 181]
        hold: 0.5
        move: 1.5
      - pose: { torso: -167.2, thigh_far: 12.8, shin_far: 12.8, thigh_near: 12.8, shin_near: 12.8, upper_arm_near: 13, forearm_near: 13 }
        hold: 4
        move: 1.5

- slug: wall-angels-wall-sit
  name: Wall angels in a wall sit
  category: mobility
  areas: [upper_body, legs]
  pattern: mobility
  default_reps: 10
  cues:
    - Sit against the wall, thighs about level
    - Back and arms flat on the wall
    - Slide the arms up and down slowly
  instructions:
    - Sit against a wall with thighs about level and knees over the ankles.
    - Press the back, head and arms flat on the wall, elbows bent like a goalpost.
    - Slide the arms up the wall as far as they go without lifting off, then back down.
    - Move slowly and keep the ribs down.
  animation:
    anchor: ankle_near
    accent: [upper_arm_near, forearm_near]
    highlight: [torso]
    props: [{ type: wall, x: 54 }]
    still: 0
    keyframes:
      - pose: { torso: -90, thigh_near: 0, shin_near: 90, foot_near: 0, thigh_far: 0, shin_far: 90, foot_far: 0, upper_arm_near: 180, forearm_near: -90, upper_arm_far: 180, forearm_far: -90 }
        scale: { upper_arm_near: 0.2, upper_arm_far: 0.2 }
        at: [110, 182]
        hold: 0.6
        move: 2
      - pose: { upper_arm_near: -90, forearm_near: -90, upper_arm_far: -90, forearm_far: -90 }
        scale: { upper_arm_near: 1, upper_arm_far: 1 }
        hold: 0.4
        move: 2

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/237/shoulder-stability-mobility-series-i-y-t-w-formations/
- slug: w-raise-hinge
  name: W's in a hinge
  category: activation
  areas: [upper_body]
  pattern: pull
  default_reps: 15
  cues:
    - Hinge forward, flat back
    - Pull elbows back into a W
    - Squeeze the shoulder blades
  instructions:
    - Stand with soft knees and hinge forward to a flat back, arms hanging.
    - Pull the elbows back and up beside the ribs, hands out wide, to make a W.
    - Squeeze the shoulder blades together and down, then lower slowly.
    - Keep the neck long and the lower back still.
  animation:
    anchor: ankle_near
    accent: [upper_arm_near, forearm_near]
    highlight: [shoulder]
    still: 1
    keyframes:
      - pose: { torso: -25, neck: 0, thigh_near: 65, shin_near: 98, foot_near: 0, thigh_far: 65, shin_far: 98, foot_far: 0, upper_arm_near: 92, forearm_near: 92, upper_arm_far: 88, forearm_far: 88 }
        at: [112, 182]
        hold: 0.4
        move: 1
      - pose: { upper_arm_near: 150, forearm_near: -40, upper_arm_far: 150, forearm_far: -40 }
        scale: { upper_arm_near: 0.75, forearm_near: 0.8, upper_arm_far: 0.75, forearm_far: 0.8 }
        hold: 1
        move: 1.2

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/237/shoulder-stability-mobility-series-i-y-t-w-formations/
- slug: t-raise-hinge
  name: T's in a hinge
  category: activation
  areas: [upper_body]
  pattern: pull
  default_reps: 15
  cues:
    - Hinge forward, flat back
    - Raise straight arms out into a T
    - Thumbs up, squeeze the shoulder blades
  instructions:
    - Stand with soft knees and hinge forward to a flat back, arms hanging.
    - With straight arms and thumbs up, raise the arms out to the sides into a T.
    - Squeeze the shoulder blades at the top, then lower slowly.
    - Lift only as high as you can without shrugging.
