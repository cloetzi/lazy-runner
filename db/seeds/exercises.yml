- slug: glute-bridge-single-leg-lift
  name: Glute bridge with single-leg lifts
  alternating: true
  category: activation
  areas: [hips, core]
  pattern: hinge
  default_reps: 16
  cues:
    - Bridge up, squeeze the glutes
    - Lift one foot, then the other
    - Keep the hips level
  instructions:
    - Lie on your back, knees bent and feet flat about hip-width apart, arms by your sides.
    - Press through the heels and squeeze the glutes to lift the hips into a straight line from shoulders to knees.
    - Keeping the hips up and level, lift one foot a little off the floor, put it down, then lift the other.
    - Lower slowly when the set is done.
  animation:
    anchor: shoulder
    accent: [thigh_near, shin_near, thigh_far, shin_far]
    highlight: [hip]
    props: [{ type: mat, x: 14, width: 172 }]
    still: 2
    keyframes:
