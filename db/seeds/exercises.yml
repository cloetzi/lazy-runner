- slug: chest-stretch-wall
  name: Chest stretch on wall
  category: stretch
  areas: [upper_body]
  pattern: mobility
  unilateral: true
  default_seconds: 20
  cues:
    - Forearm on the wall, elbow above shoulder
    - Turn the body gently away
    - Feel the front of the chest and shoulder
  instructions:
    - Stand side-on to a wall, forearm on it with the elbow at or just above shoulder height.
    - Step the near foot forward and slowly turn the chest away from the wall.
    - Keep the shoulder down and back; stop at a gentle stretch across the chest and front of the shoulder.
    - Breathe and hold, then switch arms.
  animation:
    anchor: ankle_far
    accent: [upper_arm_near, forearm_near]
    highlight: [shoulder]
    props: [{ type: wall, x: 77 }]
    still: 1
    keyframes:
      - pose: { torso: -90, thigh_near: 85, shin_near: 92, thigh_far: 95, shin_far: 92, upper_arm_near: 180, forearm_near: -90, upper_arm_far: 90, forearm_far: 90 }
        at: [110, 182]
        hold: 1
        move: 2
      - pose: { torso: -84, thigh_near: 75, shin_near: 95, thigh_far: 95, shin_far: 100, upper_arm_near: -175, forearm_near: -112, upper_arm_far: 95, forearm_far: 92 }
        hold: 3
        move: 2

