# Form reference: https://catalystathletics.com/exercise/174/Split-Squat/
- slug: split-squat
  name: Split squat
  category: strength
  areas: [legs]
  pattern: lunge
  unilateral: true
  default_reps: 8
  cues:
    - Long stride, back heel up
    - Drop the back knee straight down
    - Push up through the front heel
  instructions:
    - Stand in a long stride, front foot flat and the back foot up on its toes, feet hip-width apart.
    - Hands on the hips, chest up and the weight mostly on the front foot.
    - Lower the back knee straight down towards the floor until the front thigh is about level.
    - Push up through the front heel to the top, keeping the front knee over the toes, and repeat before changing legs.
  mistakes:
    - The front knee caving in or the front heel lifting
    - Leaning forward over the front thigh
  # Left side: the near leg is in front. Both feet stay put; the back knee
  # stops just above the floor. Timed to the 3111 tempo used in the program.
  animation:
    anchor: ankle_near
    accent: [thigh_near, shin_near]
    highlight: [thigh_near, hip]
    still: 1
    keyframes:
      - pose: { torso: -88, neck: 0, thigh_near: 58, shin_near: 97, foot_near: 0, thigh_far: 107.4, shin_far: 143.6, foot_far: 62, upper_arm_near: 110, forearm_near: 50, upper_arm_far: 106, forearm_far: 46 }
