  category: mobility
  areas: [upper_body]
  pattern: mobility
  unilateral: true
  default_reps: 10
  cues:
    - Lie on your side, knees stacked and bent
    - Open the top arm to the other side
    - Keep the knees together
  instructions:
    - Lie on your side, knees bent and stacked in front of you, arms straight out at shoulder height.
    - Lift the top arm up and over to the other side, turning the chest toward the ceiling.
    - Follow the hand with your eyes and keep the knees together on the floor.
