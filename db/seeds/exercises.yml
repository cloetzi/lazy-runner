# Form reference: https://www.strengthlog.com/curtsy-lunge/
- slug: curtsy-lunge
  name: Curtsy lunge
  category: strength
  areas: [legs, hips]
  pattern: lunge
  equipment: [weight]
  unilateral: true
  default_reps: 12
  cues:
    - Step back and across behind you
    - Front knee tracks over the toes
    - Push back up through the front foot
  instructions:
    - Stand tall holding the weight at your chest.
    - Step one foot back and across behind the other, like a curtsy.
    - Bend both knees until the back knee nears the floor, front knee tracking over the toes.
    - Push through the front heel to stand and bring the feet together.
  animation:
    anchor: ankle_near
