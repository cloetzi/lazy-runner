# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/127/single-arm-single-leg-romanian-dead-lift/
- slug: single-leg-deadlift
  name: Single-leg deadlift
  category: strength
  areas: [legs, hips]
  pattern: hinge
  equipment: [weight]
  unilateral: true
  default_reps: 10
  cues:
    - Stand on one leg, soft knee
    - Hinge and reach the back leg long
    - Hips stay square to the floor
  instructions:
    - Stand on one leg with a soft knee, weight in the opposite hand.
    - Hinge at the hip, reaching the free leg straight back as the chest tips forward.
    - Let the weight hang below the shoulder and keep the hips square to the floor.
    - Drive through the standing foot to return upright, then balance before the next rep.
  animation:
    anchor: ankle_near
    accent: [torso, thigh_far, shin_far]
    highlight: [thigh_near, hip]
    props: [{ type: dumbbell, at: hand_far }]
