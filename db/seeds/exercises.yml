# Form reference: https://catalystathletics.com/exercise/743/Single-Leg-RDL/
- slug: single-leg-hinge
  name: Single-leg hinge
  category: strength
  areas: [legs, hips]
  pattern: hinge
  unilateral: true
  default_reps: 8
  cues:
    - Stand on one leg, soft knee
    - Reach the hands down as the free leg goes back
    - Hips stay square to the floor
  instructions:
    - Stand on one leg with a soft knee, arms hanging in front of you.
    - Hinge at the hip, reaching the hands forward and down as the free leg goes straight back.
    - Keep the back flat and the hips square, and stop when the body is about level or the hamstring is tight.
    - Drive through the standing foot to come upright, then balance before the next rep.
  mistakes:
    - Rounding the back to reach lower
    - The hip of the free leg turning up to the ceiling
  # Left side: the near leg stands, the free foot just off the floor. The
  # single-leg deadlift without the weight, timed to the 3111 tempo used in
  # the program.
  animation:
    anchor: ankle_near
    accent: [torso, thigh_far, shin_far]
    highlight: [thigh_near, hip]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 88, shin_near: 92, foot_near: 0, thigh_far: 98, shin_far: 140, foot_far: 40, upper_arm_near: 84, forearm_near: 82, upper_arm_far: 86, forearm_far: 84 }
        at: [104, 182]
        hold: 1
        move: 3
      - pose: { torso: -8, neck: 5, thigh_near: 72, shin_near: 96, thigh_far: 172, shin_far: 172, foot_far: 85, upper_arm_near: 78, forearm_near: 74, upper_arm_far: 80, forearm_far: 76 }
        hold: 1
        move: 1

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/126/single-arm-row/
- slug: single-arm-single-leg-row
  name: Single-arm single-leg row
  category: strength
  areas: [upper_body, legs]
  pattern: pull
  equipment: [weight]
  unilateral: true
  default_reps: 10
  cues:
    - Stand on one leg, hinge forward
    - Row the weight toward the hip
    - Keep the hips level
  instructions:
    - Stand on one leg, weight in the opposite hand, and hinge until the back is nearly flat.
    - Reach the free leg long behind you for balance.
    - Row the weight up toward the hip, elbow close to the body, then lower it slowly.
    - Keep the hips level and the shoulders square throughout.
