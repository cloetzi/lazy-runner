- slug: seated-hamstring-stretch
  name: Seated hamstring stretch
  category: stretch
  areas: [legs]
  pattern: mobility
  unilateral: true
  default_seconds: 30
  cues:
    - Sit tall, one leg long
    - Hinge forward from the hips
    - Keep the back long, not rounded
  instructions:
    - Sit tall on the floor, one leg straight in front with the toes up.
    - Bend the other knee out to the side, sole against the inside of the straight leg.
    - Hinge forward from the hips with a long back, reaching toward the shin or foot.
    - Stop where you feel the back of the thigh; don't round the back to reach further.
  animation:
    anchor: hip
    accent: [torso]
    highlight: [thigh_near]
    props: [{ type: mat, x: 30, width: 150 }]
    still: 1
    keyframes:
      - pose: { torso: -75, neck: 0, thigh_near: 0, shin_near: 0, foot_near: -85, thigh_far: 8, shin_far: 172, foot_far: 180, upper_arm_near: 67.1, forearm_near: 24.3, upper_arm_far: 64, forearm_far: 22 }
        scale: { thigh_far: 0.5, shin_far: 0.55, foot_far: 0.4 }
        at: [70, 175]
        hold: 1
        move: 2.5
      - pose: { torso: -30, neck: 10, upper_arm_near: -13.8, forearm_near: 60.7, upper_arm_far: -10, forearm_far: 58 }
        hold: 3
        move: 2

- slug: glute-hug-stretch
  name: Glute hug stretch
  category: stretch
  areas: [hips]
  pattern: mobility
  unilateral: true
  default_seconds: 30
  cues:
    - Lie on your back
    - Hug one knee toward the opposite shoulder
    - Feel the outside of the hip
  instructions:
    - Lie on your back with both legs long.
    - Bend one knee and hold it with both hands.
    - Pull the knee up toward the opposite shoulder until you feel the outside of the hip.
    - Keep the other leg relaxed on the floor and the head down.
