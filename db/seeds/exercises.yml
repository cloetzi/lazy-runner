- slug: back-shoulder-rotation
  name: Back and shoulder rotation
  category: stretch
  areas: [upper_body]
  pattern: mobility
  unilateral: true
  default_seconds: 30
  cues:
    - Lie on your side, knees bent
    - Open the top arm across to the other side
    - Follow the hand with your eyes
  instructions:
    - Lie on your side, knees bent and stacked, arms straight out in front.
    - Lift the top arm up and over to the other side, letting the chest open toward the ceiling.
    - Follow the hand with your eyes and keep the knees together on the floor.
    - Rest the arm wherever it reaches and breathe into the stretch.
