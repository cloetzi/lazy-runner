- slug: hamstring-stretch-wall
  name: Hamstring stretch on wall
  category: stretch
  areas: [legs]
  pattern: mobility
  unilateral: true
  default_seconds: 20
  cues:
    - Lie down, one leg up the wall
    - Other leg long on the floor
    - Let the raised leg drop slowly as it loosens
  instructions:
    - Lie on your back in a doorway or beside a wall, other leg long on the floor.
    - Rest one heel up on the wall with the knee straight or very slightly bent.
    - Keep the lower back and hips flat; the stretch should be in the back of the raised thigh.
    - As it loosens, move the hips a little closer to the wall so the leg comes nearer vertical.
  animation:
    anchor: shoulder
    accent: [thigh_near, shin_near]
    highlight: [thigh_near]
    props: [{ type: mat, x: 14, width: 172 }]
    still: 1
    keyframes:
      - pose: { torso: 180, neck: 0, thigh_near: -72, shin_near: -72, foot_near: -162, thigh_far: 0, shin_far: 0, foot_far: -90, upper_arm_near: 2, forearm_near: 0, upper_arm_far: 3, forearm_far: 0 }
        at: [48, 175]
        hold: 1.5
        move: 3
      - pose: { thigh_near: -88, shin_near: -88, foot_near: -178 }
        hold: 3
        move: 2

