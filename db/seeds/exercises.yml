  category: strength
  weights_held: 2
  areas: [legs, hips]
  pattern: hinge
  equipment: [dumbbell]
  default_reps: 12
  cues:
    - Knees bent but fixed
    - Chest forward, push the hips back
    - Feel the hamstrings, then stand tall
  instructions:
    - Stand tall holding the weights in front of the thighs, knees slightly bent.
    - Keep the knees fixed and push the hips back, letting the weights slide down the thighs.
