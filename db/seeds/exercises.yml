# Form reference: https://www.hybridcalisthenics.com/barhangs
- slug: dead-hang
  name: Dead hang
  category: strength
  areas: [upper_body, core]
  pattern: pull
  equipment: [hangboard]
  default_seconds: 20
  cues:
    - Big holds, open hand
    - Shoulders active, not shrugged
    - Toes on the chair if you need it
  instructions:
    - Hold the largest holds of the hangboard with an open hand, about shoulder-width apart.
    - Start with your toes on a chair under the board and take only as much weight off them as feels easy on the fingers and shoulders.
    - Keep the arms straight and the shoulders gently drawn down, ribs in, and breathe.
    - Step back onto the chair before the grip fails rather than dropping off.
  mistakes:
    - Hanging from small edges or crimping
    - Letting the shoulders shrug up to the ears
  animation:
    anchor: hand_near
    accent: [forearm_near]
    highlight: [upper_arm_near, forearm_near]
    props: [{ type: hangboard, x: 82, y: 0 }]
    still: 0
    keyframes:
      - pose: { torso: -90, neck: 0, upper_arm_near: -90, forearm_near: -90, upper_arm_far: -92, forearm_far: -91, thigh_near: 80, shin_near: 160, foot_near: 120, thigh_far: 84, shin_far: 156, foot_far: 115 }
        at: [100, 10]
        hold: 3
        move: 2
      - pose: { torso: -88, thigh_near: 76, shin_near: 156, thigh_far: 80, shin_far: 152 }
        hold: 3
        move: 2

- slug: lateral-step-down
  name: Lateral step-down
  category: strength
  areas: [legs, hips]
  pattern: lunge
  equipment: [step]
  unilateral: true
  default_reps: 8
  cues:
    - Stand side-on at the edge of the step
    - Sit the hips back, knee over the middle toes
    - Tap the heel down, then stand tall
  instructions:
    - Stand side-on on a stair or step, the working foot flat near its edge and the other foot hanging off the side.
    - Sit the hips back and bend the standing knee to lower the free heel slowly toward the floor, over about three seconds.
    - Keep the knee tracking over the middle toes and the hips level; reach the arms forward to balance.
    - Lightly tap the heel down without putting weight on it, then push through the standing foot to rise.
  mistakes:
    - The knee caving inward
    - The free-leg hip dropping
    - Dropping onto the free heel instead of tapping it
  # Left side: the near leg stands on the step. Seen from the side, the free
  # leg lowers past the step towards the floor.
  animation:
    anchor: ankle_near
    accent: [thigh_near, shin_near]
    highlight: [thigh_near, hip]
    props: [{ type: block, x: 88, width: 44, height: 18 }]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 90, shin_near: 90, foot_near: 0, thigh_far: 86, shin_far: 90, foot_far: 10, upper_arm_near: 88, forearm_near: 88, upper_arm_far: 92, forearm_far: 90 }
        at: [100, 164]
        hold: 0.5
        move: 2
      - pose: { torso: -62, thigh_near: 35.5, shin_near: 117.1, thigh_far: 72, shin_far: 72, foot_far: -10, upper_arm_near: 10, forearm_near: 0, upper_arm_far: 14, forearm_far: 2 }
        hold: 0.3
        move: 1.5

- slug: single-leg-calf-raise
  name: Single-leg calf raise
  category: strength
  areas: [legs]
  equipment: [step]
  unilateral: true
  default_reps: 12
  cues:
    - Ball of the foot on the edge
    - Rise all the way onto the toes
    - Lower slowly below the step
  instructions:
    - Stand on one foot with its ball on the edge of a step, heel hanging off, a hand on the wall for balance.
    - Keep the knee straight but not locked and the other foot off the step.
    - Rise as high as you can onto the toes in about a second.
    - Lower slowly, over two to three seconds, until the heel is a little below the step.
  mistakes:
    - Bouncing at the bottom
    - Rolling out onto the little toe
  # Left side: the near foot is on the step. Slow on the way down.
  animation:
    anchor: toe_near
    accent: [shin_near, foot_near]
    highlight: [shin_near]
    props: [{ type: block, x: 104, width: 44, height: 18 }, { type: wall, x: 154 }]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 90, shin_near: 90, foot_near: -25, thigh_far: 100, shin_far: 150, foot_far: 100, upper_arm_near: 10, forearm_near: -10, upper_arm_far: 92, forearm_far: 90 }
        at: [112, 164]
        hold: 0.5
        move: 1
      - pose: { foot_near: 50 }
        hold: 1
        move: 2

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/73/standing-calf-raises-wall/
- slug: floor-calf-raise
  name: Floor calf raise
  category: strength
  areas: [legs]
  unilateral: true
  default_reps: 12
  cues:
    - One foot, a hand on the wall
    - Rise all the way onto the toes
    - Lower slowly to the floor
  instructions:
    - Stand on one foot facing a wall, a hand on it for balance and the other foot lifted behind you.
    - Keep the standing knee straight but not locked and the weight over the big toe.
    - Rise as high as you can onto the toes in about a second.
    - Lower slowly, over two to three seconds, until the heel touches the floor, then rise again.
  mistakes:
    - Bouncing off the heel at the bottom
    - Rolling out onto the little toe
  # Left side: the near foot stands. The single-leg calf raise without the
  # step, so the heel stops at the floor. Slow on the way down.
  animation:
    anchor: toe_near
    accent: [shin_near, foot_near]
    highlight: [shin_near]
    props: [{ type: wall, x: 156 }]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 90, shin_near: 90, foot_near: 0, thigh_far: 100, shin_far: 150, foot_far: 100, upper_arm_near: 10, forearm_near: -10, upper_arm_far: 92, forearm_far: 90 }
        at: [112, 182]
        hold: 0.5
        move: 1
      - pose: { foot_near: 40 }
        hold: 1
        move: 2.5

# Form reference: https://catalystathletics.com/exercise/474/Lateral-Lunge/
- slug: lateral-lunge
  name: Lateral lunge
  category: strength
  areas: [legs, hips]
  pattern: lunge
  unilateral: true
  default_reps: 8
  cues:
    - Big step out to the side
    - Sit back into that hip, other leg straight
    - Push off and step back to the middle
  instructions:
    - Stand tall with the feet together and the hands at your chest.
    - Take a wide step to one side, toes pointing forward, and sit the hips back over that foot.
    - Bend the stepping knee over its toes while the other leg stays straight with the foot flat.
    - Push off the bent leg to step back to the middle.
  mistakes:
    - The bent knee caving in or passing far beyond the toes
    - Rounding the back to reach lower
  # Left side: the near leg steps out and bends. The straight far leg reaches
  # sideways, away from the viewer, so it is drawn foreshortened.
  animation:
    anchor: ankle_near
    accent: [thigh_near, shin_near]
    highlight: [thigh_near, hip]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 90, shin_near: 90, foot_near: 0, thigh_far: 90, shin_far: 90, foot_far: 0, upper_arm_near: 80, forearm_near: -60, upper_arm_far: 84, forearm_far: -56 }
        at: [100, 182]
        hold: 0.5
        move: 1.5
      - pose: { torso: -55, thigh_near: 22.2, shin_near: 121.5, thigh_far: 95, shin_far: 95, upper_arm_near: 70, forearm_near: -30, upper_arm_far: 74, forearm_far: -26 }
        scale: { thigh_far: 0.62, shin_far: 0.62 }
        hold: 0.4
        move: 1.2

- slug: half-kneeling-press
  name: Half-kneeling single-arm press
  category: strength
  areas: [upper_body, core]
  pattern: push
  equipment: [weight]
  unilateral: true
  default_reps: 8
  cues:
    - Down knee on the pressing side
    - Squeeze the glute, ribs down
    - Press straight up beside the ear
  instructions:
    - Kneel on a mat on the knee of the pressing side, the other foot flat in front with the knee over the ankle.
    - Hold the weight at the shoulder, elbow in front of the body and the wrist straight; a kettlebell rests on the back of the forearm.
    - Squeeze the glute of the down leg and keep the ribs down so the back does not arch.
    - Press the weight straight up until the arm is beside the ear, then lower it under control to the shoulder.
  mistakes:
    - Leaning back or arching to finish the press
    - Shrugging the shoulder up
  # Left side: the near knee is down and the near arm presses.
  animation:
    anchor: knee_near
    accent: [upper_arm_near, forearm_near]
    highlight: [shoulder]
    props: [{ type: mat, x: 40, width: 130 }, { type: dumbbell, at: hand_near }]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 90, shin_near: 180, foot_near: 180, thigh_far: 5, shin_far: 85, foot_far: 0, upper_arm_near: 75, forearm_near: -100, upper_arm_far: 100, forearm_far: 60 }
        at: [80, 179]
        hold: 0.4
        move: 1
      - pose: { upper_arm_near: -93, forearm_near: -90 }
        hold: 0.4
        move: 1.5

# Form reference: https://catalystathletics.com/exercise/749/Wall-Sit/
- slug: wall-sit
  name: Wall sit
  category: strength
  areas: [legs]
  pattern: squat
  default_seconds: 40
  cues:
    - Back flat on the wall
    - Thighs about level, knees over ankles
    - Breathe and hold
  instructions:
    - Stand with your back on a wall and walk the feet out about two feet, hip-width apart.
    - Slide down until the thighs are about level, or higher if the knees complain.
    - Keep the knees over the ankles and in line with the toes, back and head on the wall.
    - Hold and breathe, then walk the feet back in to stand up.
  mistakes:
    - Knees drifting in front of the toes or caving in
    - Pushing the hands on the thighs
  animation:
    anchor: ankle_near
    accent: [thigh_near]
    highlight: [thigh_near]
    props: [{ type: wall, x: 54 }]
    still: 0
    keyframes:
      - pose: { torso: -90, neck: 0, thigh_near: 0, shin_near: 90, foot_near: 0, thigh_far: 0, shin_far: 90, foot_far: 0, upper_arm_near: 5, forearm_near: 0, upper_arm_far: 8, forearm_far: 2 }
        at: [110, 182]
        hold: 3
        move: 1.5
      - pose: { upper_arm_near: 10, forearm_near: 4, upper_arm_far: 12, forearm_far: 6 }
        hold: 3
        move: 1.5

# Form reference: https://bodysolid.com/exercises/article/164/exercise_ball_-_roll_out
- slug: stability-ball-rollout
  name: Stability ball rollout
  category: strength
  areas: [core]
  pattern: anti_extension
  equipment: [stability_ball]
  default_reps: 8
  cues:
    - Forearms on the ball, ribs down
    - Roll out only as far as the back stays flat
    - Pull the ball back with the abs
  instructions:
    - Kneel on a mat with the forearms on a stability ball in front of you, hands together.
    - Brace the abs and squeeze the glutes so the body is straight from knees to head.
    - Roll the ball forward by straightening the hips and reaching the arms out, as far as you can keep the lower back from sagging.
    - Pull the ball back with the abs to the start, keeping the hips in line.
  mistakes:
    - The lower back sagging at the far end
    - Piking the hips back first on the way in
  animation:
    anchor: knee_near
    accent: [torso, upper_arm_near]
    highlight: [torso]
    props: [{ type: mat, x: 4, width: 180 }, { type: swiss_ball, at: elbow_near }]
    still: 1
    keyframes:
      - pose: { torso: -45, neck: 0, thigh_near: 100, shin_near: 180, foot_near: 180, thigh_far: 100, shin_far: 180, foot_far: 180, upper_arm_near: 60, forearm_near: 0, upper_arm_far: 62, forearm_far: 2 }
        at: [60, 179]
        hold: 0.5
        move: 2
      - pose: { torso: -20, thigh_near: 130, thigh_far: 130, upper_arm_near: 0, forearm_near: 0, upper_arm_far: 2, forearm_far: 2 }
        hold: 0.5
        move: 1.5
