        hold: 1
        move: 1

- slug: hamstring-bridge-bench
  name: Hamstring bridge on bench
  category: strength
  areas: [legs, hips]
  pattern: hinge
  equipment: [bench]
  default_reps: 15
  cues:
    - Heels on the bench, knees slightly bent
    - Drive the hips up
    - Lower with control
  instructions:
    - Lie on your back with the heels on a bench or chair seat, knees slightly bent.
    - Press the heels down and drive the hips up until shoulders, hips and knees line up.
    - Feel the back of the thighs working, not the lower back.
    - Lower the hips slowly to the floor.
