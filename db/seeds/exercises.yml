    accent: [upper_arm_near, forearm_near]
    highlight: [torso]
    props: [{ type: mat, x: 20, width: 160 }]
    still: 2
    keyframes:
      - pose: { torso: 180, neck: 0, thigh_far: 40, shin_far: 0, foot_far: 0, thigh_near: 5, shin_near: 0, foot_near: 0, upper_arm_far: 15, forearm_far: 15, upper_arm_near: 20, forearm_near: 20 }
