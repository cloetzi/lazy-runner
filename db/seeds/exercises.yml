        hold: 0.5
        move: 2

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/32/front-plank/
- slug: plank
  name: Plank
  category: strength
  areas: [core]
  pattern: anti_extension
  default_seconds: 60
  cues:
    - Elbows under shoulders
    - Ribs down, squeeze the glutes
    - Breathe, body in one line
  instructions:
    - Forearms on the floor with the elbows under the shoulders, legs long behind you.
    - Lift onto the toes so the body makes one line from head to heels.
    - Ribs down, glutes squeezed, and breathe steadily.
    - Drop the knees before the hips sag or the back arches.
  animation:
    anchor: elbow_near
    accent: [torso]
    highlight: [torso]
    props: [{ type: mat, x: 4, width: 170 }]
    still: 1
    keyframes:
      - pose: { torso: -20, neck: 0, upper_arm_near: 90, forearm_near: 0, upper_arm_far: 90, forearm_far: 0, thigh_near: 164.8, shin_near: 180, foot_near: 180, thigh_far: 164.8, shin_far: 180, foot_far: 180 }
