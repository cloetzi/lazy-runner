- slug: dead-bug
  name: Dead bug
  category: activation
  alternating: true
  areas: [core]
  pattern: anti_extension
  default_reps: 10
  cues:
    - Lie on your back, arms up, knees over hips
    - Lower opposite arm and leg slowly
    - Keep the lower back on the floor
  instructions:
    - Lie on your back, arms reaching to the ceiling, hips and knees bent at 90 degrees.
    - Press the lower back gently into the floor.
    - Slowly lower one arm overhead and the opposite leg toward the floor, stopping before the back arches.
    - Return and repeat on the other side.
  animation:
    anchor: shoulder
    accent: [upper_arm_near, forearm_near, thigh_far, shin_far]
    highlight: [torso]
    props: [{ type: mat, x: 10, width: 180 }]
    still: 1
    keyframes:
      - pose: { torso: 180, neck: 0, upper_arm_near: -90, forearm_near: -90, upper_arm_far: -90, forearm_far: -90, thigh_near: -90, shin_near: 0, foot_near: -90, thigh_far: -90, shin_far: 0, foot_far: -90 }
        at: [64, 175]
        hold: 0.5
        move: 2
      - pose: { upper_arm_near: -172, forearm_near: -172, thigh_far: -9, shin_far: -9, foot_far: -99 }
        hold: 0.5
        move: 1.5
      - pose: { upper_arm_near: -90, forearm_near: -90, thigh_far: -90, shin_far: 0, foot_far: -90 }
        hold: 0.5
        move: 2
      - pose: { upper_arm_far: -172, forearm_far: -172, thigh_near: -9, shin_near: -9, foot_near: -99 }
        hold: 0.5
        move: 1.5

# Form reference: https://www.hybridcalisthenics.com/barhangs
- slug: scapular-pull-hangboard
  name: Hangboard scapular pull
  category: activation
  areas: [upper_body, core]
  pattern: pull
  equipment: [hangboard]
  default_reps: 6
  cues:
    - Hang on the big holds, arms straight
    - Pull the shoulders down, away from the ears
    - Lower slowly back to the hang
  instructions:
    - Hold the largest, most comfortable holds of the hangboard with an open hand, thumbs alongside.
    - Keep your toes on a chair under the board to take as much weight as you need.
    - With the arms straight, draw the shoulder blades down and back so the body rises a little.
    - Pause, then let the shoulders rise slowly back up without dropping into the hang.
  mistakes:
    - Bending the elbows to turn it into a pull-up
    - Small edges or full crimps; this is shoulder work, not finger work
  animation:
    anchor: hand_near
    accent: [upper_arm_near]
    highlight: [shoulder]
    props: [{ type: hangboard, x: 82, y: 0 }]
    still: 1
    keyframes:
      - pose: { torso: -90, neck: 0, upper_arm_near: -90, forearm_near: -90, upper_arm_far: -92, forearm_far: -91, thigh_near: 80, shin_near: 160, foot_near: 120, thigh_far: 84, shin_far: 156, foot_far: 115 }
        at: [100, 10]
        hold: 0.6
        move: 1
      - pose: { torso: -84, neck: -4, upper_arm_near: -96, forearm_near: -94, upper_arm_far: -98, forearm_far: -95 }
        scale: { upper_arm_near: 0.85, upper_arm_far: 0.85 }
        hold: 1
        move: 1.2

# --- Strength ---
- slug: goblet-squat
  name: Goblet squat
  category: strength
  areas: [legs]
  pattern: squat
  equipment: [weight]
  default_reps: 8
  cues:
    - Hold the weight at your chest
    - Weight in the heels
    - Sit down between the knees, chest up
  instructions:
    - Stand with the feet a little wider than the hips, toes turned slightly out.
    - Hold one weight against your chest with both hands, elbows pointing down (a dumbbell upright by one end, a kettlebell by the horns).
    - Sit the hips down and back between the knees, chest up and weight in the heels.
    - Go as low as you can with a flat back, then drive through the heels to stand tall.
  # Timed to the 2111 tempo used in the workout: two seconds down, one at the
  # bottom, one up, one at the top.
  animation:
    anchor: ankle_near
    accent: [thigh_near, shin_near]
    highlight: [thigh_near, hip]
    props: [{ type: dumbbell, at: hand_near }]
    still: 0
    keyframes:
      - pose: { torso: -90, thigh_near: 88, shin_near: 92, thigh_far: 91, shin_far: 89, foot_far: -4, upper_arm_near: 72, forearm_near: -62, upper_arm_far: 76, forearm_far: -58 }
        at: [96, 182]
        hold: 1
        move: 2
