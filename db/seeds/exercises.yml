- slug: calf-stretch
  name: Calf stretch
  category: stretch
  areas: [legs]
  pattern: mobility
  unilateral: true
  default_seconds: 20
  cues:
    - Hands on the wall, back heel down
    - Half the time knee straight
    - Half the time knee bent
  instructions:
    - Hands on a wall, one foot forward with the knee bent and the other a long step back.
    - Press the back heel into the floor, toes pointing straight ahead, back knee straight.
    - Lean into the wall until you feel the upper calf, and hold.
    - Then bend the back knee slightly, heel still down, to move the stretch lower toward the Achilles.
  animation:
    anchor: ankle_near
    accent: [shin_near]
    highlight: [shin_near]
    props: [{ type: wall, x: 168 }]
    still: 0
    keyframes:
      - pose: { torso: -62, thigh_near: 110, shin_near: 110, foot_near: 0, thigh_far: 60, shin_far: 100, foot_far: 0, upper_arm_near: -5, forearm_near: -55, upper_arm_far: -8, forearm_far: -58 }
        at: [66, 182]
        hold: 4
        move: 1.5
      - pose: { thigh_near: 98, shin_near: 124, thigh_far: 64, shin_far: 104 }
        hold: 4
        move: 1.5

- slug: quad-stretch-bench
  name: Quad stretch on bench
  category: stretch
  areas: [legs]
  pattern: mobility
  equipment: [bench]
  unilateral: true
  default_seconds: 30
  cues:
    - Back foot up on the bench
    - Tuck the pelvis, stand tall
    - Feel the front of the back thigh
  instructions:
    - Stand tall with your back to a bench or sturdy chair, one foot flat on the floor.
    - Rest the top of the other foot on the seat behind you.
    - Tuck the pelvis under and squeeze the glute of the back leg until the front of the thigh stretches.
    - Bend the standing knee a little to deepen it; keep the chest up and the lower back neutral.
  animation:
    anchor: ankle_far
    accent: [thigh_near, shin_near]
    highlight: [thigh_near]
    props: [{ type: bench, x: 26, width: 56, height: 40 }]
    still: 1
    keyframes:
      - pose: { torso: -90, thigh_far: 90, shin_far: 90, foot_far: 0, thigh_near: 103.8, shin_near: -178.9, foot_near: 175, upper_arm_near: 112, forearm_near: 50, upper_arm_far: 110, forearm_far: 48 }
        at: [120, 182]
        hold: 1
        move: 2
      - pose: { torso: -86, thigh_far: 70.4, shin_far: 106.1, thigh_near: 100.1, shin_near: -172.3, foot_near: 178 }
        hold: 3
        move: 2

