# Exercise library. Cues are short lines shown in the player while the step runs.
# Cue text is original; form notes from the source program are paraphrased.
# Review each cue for accuracy before relying on it.
# `equipment` lists slugs from equipment.yml; leave it out for bodyweight.
# One held weight that a dumbbell or a kettlebell does equally well is
# `weight`; a pair in the hands (`weights_held: 2`) is `dumbbell`, since a
# kettlebell rarely comes in pairs at home. A step can still name other gear.
# `areas` is where it works, for finding it in the library: legs, hips, core,
# upper_body (the first is the main one). `pattern` is the movement it trains,
# for offering swaps that do the same job: squat, lunge, hinge, push, pull,
# anti_extension, anti_rotation (core) or mobility.
# `unilateral: true` is done one side at a time: a set runs left then right, and
# its reps or seconds count per side. `alternating: true` switches sides within
# one set (a dead bug): its reps count both sides together.
# `weights_held` is 2 when a dumbbell goes in each hand; weights are per weight.

# --- Stretches ---
- slug: half-kneel-quad-stretch
  name: Half-kneel quad stretch
  category: stretch
  areas: [legs, hips]
  pattern: mobility
  unilateral: true
  default_seconds: 20
  cues:
    - Back knee down, front foot flat
    - Tuck the pelvis under
    - Feel the front of the back thigh
  instructions:
    - Kneel on a mat on your back knee, front foot flat and the front knee over the ankle.
    - Stand tall and tuck the pelvis under, as if pulling your belt buckle up.
    - Shift the hips gently forward until you feel a stretch at the front of the back thigh and hip.
    - Keep the chest up and the lower back neutral; do not arch to go further.
  # Left side: the near (back) knee is down and stretched.
  animation:
    anchor: knee_near
    accent: [thigh_near]
    highlight: [thigh_near]
    props: [{ type: mat, x: 40, width: 130 }]
    still: 1
    keyframes:
      - pose: { torso: -90, thigh_near: 90, shin_near: 180, foot_near: 180, thigh_far: 10, shin_far: 70, upper_arm_near: 95, forearm_near: 75, upper_arm_far: 92, forearm_far: 75 }
        at: [80, 179]
        hold: 0.6
        move: 1.5
      - pose: { torso: -94, thigh_near: 120, thigh_far: 0, shin_far: 102 }
        hold: 2.5
        move: 1.5

- slug: pigeon-stretch
  name: Pigeon stretch
  category: stretch
  areas: [hips]
  pattern: mobility
  unilateral: true
  default_seconds: 20
  cues:
    - Front knee in line with your belly button
    - Back leg long behind you
    - Sink the hips evenly
  mistakes:
    - Twisting the hips toward the bent leg
  instructions:
    - From hands and knees, slide one knee forward behind the same wrist and let the shin angle across toward the other hip.
    - Straighten the other leg long behind you, top of the foot on the mat.
    - Square the hips to the floor and sink them evenly; stay upright or walk the hands forward to fold over the front leg.
    - Ease off if you feel it in the front knee rather than the outside of the hip.
  animation:
    anchor: hip
    accent: [torso]
    highlight: [hip]
    props: [{ type: mat, x: 40, width: 140 }]
    still: 1
    keyframes:
      - pose: { torso: -80, neck: 0, thigh_near: 12, shin_near: 180, foot_near: 200, thigh_far: 168, shin_far: 180, foot_far: 180, upper_arm_near: 95, forearm_near: 90, upper_arm_far: 85, forearm_far: 90 }
        scale: { shin_near: 0.6, foot_near: 0.5 }
        at: [100, 168]
        hold: 2.5
        move: 2
      - pose: { torso: -25, neck: 10, upper_arm_near: 85, forearm_near: 0, upper_arm_far: 82, forearm_far: 0 }
        hold: 3
        move: 2

