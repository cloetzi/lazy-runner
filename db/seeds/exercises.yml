        at: [56, 174]
        hold: 1
        move: 2
      - pose: { upper_arm_near: -90, forearm_near: -90, neck: 8 }
        scale: { upper_arm_near: 1, forearm_near: 1 }
        hold: 0
        move: 2
      - pose: { upper_arm_near: 160, forearm_near: 160, neck: 14 }
        scale: { upper_arm_near: 0.35, forearm_near: 0.35 }
        hold: 5
        move: 2
      - pose: { upper_arm_near: -90, forearm_near: -90, neck: 8 }
        scale: { upper_arm_near: 1, forearm_near: 1 }
        hold: 0
        move: 2

- slug: frog-groin-stretch
  name: Frog groin stretch
  category: stretch
  areas: [hips]
  pattern: mobility
  default_seconds: 30
  cues:
    - On hands or forearms, knees wide
    - Ankles in line with knees
    - Rock the hips back gently
  instructions:
    - Start on hands or forearms, knees wide apart on a mat.
    - Turn the feet out so the ankles line up behind the knees.
    - Slowly rock the hips back toward the heels until the inner thighs stretch.
    - Keep the back flat and come forward again if the hips or knees pinch.
  animation:
    anchor: knee_near
    accent: [torso]
    highlight: [hip]
    props: [{ type: mat, x: 30, width: 150 }]
    still: 1
    keyframes:
      - pose: { torso: -13.1, neck: 0, thigh_near: 90, shin_near: 180, foot_near: 180, thigh_far: 90, shin_far: 180, foot_far: 180, upper_arm_near: 90, forearm_near: 0, upper_arm_far: 90, forearm_far: 0 }
        scale: { thigh_near: 0.4, thigh_far: 0.4, foot_near: 0.5, foot_far: 0.5 }
        at: [107, 180]
        hold: 1
        move: 2
      - pose: { torso: -18, thigh_near: 50, thigh_far: 50 }
        hold: 3
        move: 2

# Form reference: https://www.acefitness.org/resources/everyone/exercise-library/174/overhead-triceps-stretch/
- slug: overhead-triceps-stretch
  name: Overhead triceps stretch
  category: stretch
  areas: [upper_body]
  pattern: mobility
  unilateral: true
  default_seconds: 30
  cues:
    - Hand reaches down between the shoulder blades
    - Other hand eases the elbow back
    - Ribs down, don't arch
  instructions:
    - Stand tall and raise one arm overhead.
    - Bend the elbow so the hand drops down between the shoulder blades.
    - With the other hand, ease the raised elbow gently back behind the head.
    - Keep the ribs down so the lower back doesn't arch.
  animation:
    anchor: ankle_near
    accent: [upper_arm_near, forearm_near]
    highlight: [upper_arm_near]
    still: 1
    keyframes:
      - pose: { torso: -90, upper_arm_near: -100, forearm_near: 95, upper_arm_far: -44.8, forearm_far: -162.3 }
        at: [100, 182]
        hold: 1
        move: 2
      - pose: { upper_arm_near: -108, forearm_near: 100, upper_arm_far: -52.8, forearm_far: -170.5 }
        hold: 3
        move: 2

# --- Activation and mobility ---
- slug: side-plank-knee-leg-raise
  name: Side plank from knee with leg raise
  category: activation
  areas: [core, hips]
  pattern: anti_rotation
  unilateral: true
  default_reps: 8
  cues:
    - Elbow under shoulder, bottom knee down
    - Hips up in a straight line
    - Lift the top leg slowly, then lower
  instructions:
    - Lie on your side, elbow under the shoulder, bottom knee bent and top leg straight.
    - Lift the hips so the body makes a line from the shoulder through the bottom knee.
    - Raise the straight top leg slowly, toes pointing forward, then lower it with control.
    - Keep the hips up and stacked the whole set.
  animation:
    anchor: elbow_far
    accent: [thigh_near, shin_near]
    highlight: [hip]
    props: [{ type: mat, x: 20, width: 140 }]
    still: 1
    keyframes:
      - pose: { torso: -161, neck: 0, upper_arm_far: 90, forearm_far: 180, thigh_far: 19, shin_far: 180, foot_far: 180, thigh_near: 10, shin_near: 10, foot_near: 100, upper_arm_near: 19, forearm_near: -10 }
        scale: { forearm_far: 0.6, shin_far: 0.35, foot_far: 0.3, foot_near: 0.4 }
        at: [46, 181]
        hold: 0.6
        move: 1.2
      - pose: { thigh_near: -18, shin_near: -18, foot_near: 72 }
        hold: 0.8
        move: 1.2

