        hold: 5
        move: 1.5

- slug: swiss-ball-single-leg-bridge
  name: Swiss ball single-leg bridge
  category: strength
  areas: [hips, legs]
  pattern: hinge
  equipment: [stability_ball]
  unilateral: true
  default_seconds: 20
  cues:
    - One heel on the ball, other leg up
    - Hips up and level
    - Hold still, breathe
  instructions:
    - Lie on your back with one heel on a stability ball, other leg raised straight up.
    - Lift the hips until they are level and in line with the shoulders.
    - Hold still and breathe, keeping the ball from rolling.
    - Lower slowly, then switch legs.
  animation:
