# Form reference: https://www.acefitness.org/education-and-resources/lifestyle/exercise-library/59/stability-ball-hamstring-curl
- slug: swiss-ball-hamstring-curl
  name: Swiss ball hamstring curl
  category: strength
  areas: [legs]
  pattern: hinge
  equipment: [stability_ball]
  default_reps: 10
  cues:
    - Heels on the ball, hips up
    - Pull the ball in with your heels
    - Roll it out slowly, hips stay up
  instructions:
    - Lie on your back with the heels and lower calves on a stability ball, arms on the floor.
    - Squeeze the glutes and lift the hips into a straight line from shoulders to heels.
    - Pull the ball in toward you with the heels, letting the hips rise a little more.
    - Roll it back out slowly without dropping the hips.
  animation:
    anchor: shoulder
    accent: [thigh_near, shin_near]
    highlight: [thigh_near]
    props: [{ type: swiss_ball, at: ankle_near }]
    still: 1
    keyframes:
