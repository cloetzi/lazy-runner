name: Release

# Once CI passes on main, release-please keeps a release PR open with the next
# version and its changelog, worked out from the conventional commits since
# the last release. Merging that PR (and CI passing on it) tags the release
# and publishes it, and the image jobs then build the container image for
# amd64 and arm64, each natively on its own runner (no emulation), push each
# by digest and join them into one multi-arch image in the GitHub container
# registry, tagged with the version (1.2.3 gives 1.2.3 and 1.2), latest and
# the commit's sha. It runs here rather than on the release event, which a
# release made with GITHUB_TOKEN doesn't send. Run by hand with a release
# tag, it builds that release again (moving latest and major.minor to it only
# when asked); without one, it pushes the commit's sha tag only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag to build again, such as v1.2.3; empty builds the commit with its sha tag only"
        required: false
      latest:
        description: "Also move latest and the major.minor tag to it (only for the newest release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # What to build and how to name, label and tag it, worked out once for
  # both platforms.
  prepare:
    needs: release-please
    # Skipped release-please (a run by hand) still builds.
    if: ${{ !cancelled() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.read.outputs.sha }}
      short: ${{ steps.read.outputs.short }}
      app: ${{ steps.read.outputs.app }}
      ruby: ${{ steps.read.outputs.ruby }}
      image: ${{ steps.read.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      version: ${{ steps.meta.outputs.version }}
    env:
      # The release to tag the image with, if any: release-please's, or the
      # tag asked for by hand.
      VERSION: ${{ needs.release-please.outputs.released == 'true' && needs.release-please.outputs.version || inputs.tag }}
      LATEST: ${{ needs.release-please.outputs.released == 'true' || inputs.tag != '' && inputs.latest }}
      # The annotations go on the multi-arch index the merge job makes.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - name: Check the release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag such as v1.2.3"; exit 1; }
      # The released commit, which a later push may already have passed (on
      # workflow_run, github.sha is main's head).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || inputs.tag || github.sha }}
      # The app's version, baked into the image for Settings and
      # /api/version, is the release's (1.2.3), or dev for a build of the
      # commit only.
      - name: Read the commit, the app and Ruby versions
        id: read
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ruby=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"
          version="${VERSION#v}"
          echo "app=${version:-dev}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.read.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.LATEST == 'true' }}
            type=raw,value=latest,enable=${{ env.LATEST == 'true' }}
            type=raw,value=sha-${{ steps.read.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.read.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.read.outputs.sha }}

  # Each platform on a runner of its own architecture (GitHub has no
  # ubuntu-latest-arm label), pushed by digest only; the merge job tags them.
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          build-args: |
            RUBY_VERSION=${{ needs.prepare.outputs.ruby }}
            APP_VERSION=${{ needs.prepare.outputs.app }}
            APP_COMMIT=${{ needs.prepare.outputs.short }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.pair }}
          cache-to: type=gha,scope=image-${{ matrix.pair }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the platform images into one multi-arch image and tags it.
  merge:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      ANNOTATIONS: ${{ needs.prepare.outputs.annotations }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          (( ${#digests[@]} == 2 )) || { echo "::error::expected 2 platform digests, got ${#digests[@]}"; exit 1; }
          args=()
          while IFS= read -r tag; do [[ -z "$tag" ]] || args+=(--tag "$tag"); done <<< "$TAGS"
          while IFS= read -r note; do [[ -z "$note" ]] || args+=(--annotation "$note"); done <<< "$ANNOTATIONS"
          sources=("${digests[@]/#/$IMAGE@sha256:}")
          # Check the index holds both platforms before any tag moves to it.
          index=$(docker buildx imagetools create --dry-run "${args[@]}" "${sources[@]}")
          echo "$index"
          platforms=$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ")' <<< "$index")
          [[ "$platforms" == *linux/amd64* && "$platforms" == *linux/arm64* ]] || { echo "::error::the image would hold $platforms"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
