name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings, About shows it.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For anything on screen, such as "iPad, Safari, landscape" or "Firefox on Linux".
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the server log around the time, how often it happens. Leave out passwords, tokens and personal data.
